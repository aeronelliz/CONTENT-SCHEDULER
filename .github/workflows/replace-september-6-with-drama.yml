name: Replace September 6 with drama stories

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/replace-september-6-drama-trigger"

permissions:
  contents: write

concurrency:
  group: facebook-daily-scheduler
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reserve replacement batch
        run: |
          test ! -f content/batch-2026-09-06-drama.started
          touch content/batch-2026-09-06-drama.started
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/batch-2026-09-06-drama.started
          git commit -m "Reserve September 6 drama replacement"
          git push origin main
      - name: Cancel old posts and schedule seven dramas
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
        run: node scripts/replace-september-6-with-drama.js
      - name: Save Meta replacement results
        if: always()
        run: |
          if ! git diff --quiet -- content/batch-2026-09-06.json content/batch-2026-09-06-drama.json; then
            git pull --rebase origin main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/batch-2026-09-06.json content/batch-2026-09-06-drama.json
            git commit -m "Save September 6 drama replacement results"
            git push origin main
          fi
