name: Schedule September 7 to 12 batch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/schedule-september-7-to-12-trigger"

permissions:
  contents: write

concurrency:
  group: facebook-daily-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Reserve the one-off batch
        run: |
          if [ ! -f content/batch-2026-09-07-to-12.started ]; then
            touch content/batch-2026-09-07-to-12.started
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/batch-2026-09-07-to-12.started
            git commit -m "Reserve September 7 to 12 Meta batch"
            git push origin main
          fi

      - name: Schedule 42 photos through Meta
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: node scripts/schedule-september-7-to-12.js

      - name: Save Meta submission results
        if: always()
        run: |
          if ! git diff --quiet -- content/batch-2026-09-07-to-12.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/batch-2026-09-07-to-12.json
            git commit -m "Save September 7 to 12 Meta results"
            git pull --rebase origin main
            git push origin main
          fi
