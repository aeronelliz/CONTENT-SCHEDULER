name: Schedule Sep 8-12 Facebook drama posts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/september-8-12-drama-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-september-8-12-drama
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Schedule 35 drama posts through Meta
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: node scripts/schedule-september-8-12-drama.js

      - name: Save Meta scheduling results
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet -- content/batch-2026-09-08-12-drama.json content/queue.json public/planner-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/batch-2026-09-08-12-drama.json content/queue.json public/planner-data.json
            git commit -m "Save Sep 8-12 Facebook scheduling results for run $GITHUB_RUN_ID"
            git pull --rebase origin main
            git push origin main
          fi
